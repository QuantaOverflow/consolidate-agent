[project]
name = "async-consolidate-agent"
version = "0.1.0"
description = "Offline-first Codex session pitfall extraction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dashscope>=1.25.0",
  "langchain>=0.3.27",
  "langchain-chroma>=0.1.0",
  "langchain-community>=0.3.27",
  "langgraph>=0.6.0",
  "langchain-qwq>=0.3.0",
  "numpy>=1.26.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "jinja2>=3.1.6",
  "umap-learn>=0.5.12",
  "hdbscan>=0.8.42",
  "pyvis>=0.3.2",
  "plotly>=6.7.0",
  "pandas>=3.0.2",
  "colorcet>=3.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
consolidate-agent = "consolidate_agent.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consolidate_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
markers = [
    "requires_api: tests that call real external APIs (DashScope); set DASHSCOPE_API_KEY to run",
]
